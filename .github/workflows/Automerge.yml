name: Auto Merge PR
'on':
  pull_request:
    types:
      - opened
    branches:
      - master
permissions:
  contents: write
  pull-requests: write
jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        run: 'gh pr merge ${{ github.event.pull_request.number }} --auto --squash'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
