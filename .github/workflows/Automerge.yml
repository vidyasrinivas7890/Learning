name: Auto Merge

on:
  pull_request:
    types: [opened]
    branches:
      - master
     
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: |
      github.event.pull_request.head.ref == 'qa'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "vidyasrinivas7890/Learning" \
            --auto \
            --squash
  
          
